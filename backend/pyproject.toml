[project]
name = "swarm-ide-backend"
version = "5.0.0"
description = "Swarm IDE — agentic IDE backend (FastAPI + LangGraph)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI uses function calls (Depends/Query) in defaults
    "E402",  # main.py loads dotenv before local imports on purpose
    "B904",  # API handlers re-raise HTTPException from caught validation errors on
             # purpose; the exception chain is never sent to the client, so
             # `raise ... from e` adds noise. (Common FastAPI convention.)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
