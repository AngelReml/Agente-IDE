name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install the REAL core deps (not a hand-picked subset) so tests run against
          # a prod-faithful environment — e.g. importing `app.graph` needs langchain.
          # requirements-platform.txt (postgres/redis/otel) is intentionally NOT
          # installed: those paths are env-gated with safe fallbacks and unit-tested
          # via fakes, so the core suite stays green and fast without them.
          pip install -r backend/requirements.txt
          # Pin ruff so the lint gate is deterministic (rule sets drift across versions).
          pip install "ruff==0.6.9"
      - name: Lint (ruff — gate)
        run: ruff check backend/app   # full ruleset (E,F,W,I,UP,B) — baseline is clean, so this FAILS on any regression
      - name: Tests
        run: cd backend && python -m pytest -q
      - name: Evals (estructura; se omiten sin claves)
        run: cd backend && python -m app.evals.harness

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (reproducible — fails if lockfile is out of sync)
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit
