name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pytest ruff
      - name: Lint (ruff — gate)
        run: ruff check backend/app   # full ruleset (E,F,W,I,UP,B) — baseline is clean, so this FAILS on any regression
      - name: Tests
        run: cd backend && python -m pytest -q
      - name: Evals (estructura; se omiten sin claves)
        run: cd backend && python -m app.evals.harness

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (reproducible — fails if lockfile is out of sync)
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit
