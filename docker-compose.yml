# Plataforma Swarm IDE — stack de escalado (Fase 2/3/6).
# Para uso local de un solo usuario NO necesitas esto: usa INICIAR.bat.
# Este compose levanta Postgres + Redis + API para el camino multi-tenant.
#
# SEGURIDAD: las credenciales se toman del entorno (.env, NO versionado). El
# compose FALLA si no las defines, para que nadie arranque con 'swarm/swarm'.
# Define en tu .env: POSTGRES_PASSWORD=<fuerte> y REDIS_PASSWORD=<fuerte>.

services:
  postgres:
    # pgvector/pgvector trae la extensión `vector` precompilada (la usa el
    # EmbeddingRetriever cuando SWARM_VECTOR_STORE=pgvector). Drop-in de postgres:16.
    # El rol crea la extensión al primer uso (CREATE EXTENSION IF NOT EXISTS vector);
    # el superuser por defecto puede. En Postgres gestionado (RDS/Cloud SQL) hay que
    # permitir 'vector' en la allowlist de extensiones, o el retriever cae a memoria.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu .env}
      POSTGRES_DB: ${POSTGRES_DB:-swarm}
    # Solo accesible desde el host local, no publicado a toda la red.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis con contraseña obligatoria (antes estaba SIN auth).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD en tu .env}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Socket-proxy con allowlist (Fase 5). Es el ÚNICO servicio que toca el socket
  # crudo del daemon; la API habla con él por TCP y nunca con /var/run/docker.sock.
  # Solo se permiten los endpoints que DockerBackend usa para contenedores efímeros:
  #   - CONTAINERS=1  → crear / inspeccionar / esperar / logs / borrar (--rm)
  #   - IMAGES=1      → `docker image inspect` del preflight
  #   - ALLOW_START=1 → `containers/{id}/start`
  #   - POST=1        → habilita métodos de escritura (POST/PUT/DELETE); sin él
  #                     todo sería de solo lectura. Cubre el DELETE de `--rm`.
  # Lo demás (EXEC, VOLUMES, NETWORKS, SWARM, host binds…) queda DENEGADO por defecto.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.4.2
    environment:
      CONTAINERS: 1
      IMAGES: 1
      ALLOW_START: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Solo accesible dentro de la red del compose; nunca publicado al host.
    expose: ["2375"]
    restart: unless-stopped
    # /_ping lo permite el proxy por defecto; wget viene en la base alpine/busybox.
    # Así la API espera a que el proxy esté LISTO (no solo arrancado) antes de usarlo.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # La API NO ejecuta el agente ni toca Docker (Fase 6, paso 4): solo encola los
  # runs en Redis y hace de tail del bus de eventos hacia el cliente (SSE). El
  # ejecutor real es el servicio `worker`. Por eso aquí NO hay SWARM_SANDBOX ni
  # DOCKER_HOST ni dependencia del socket-proxy.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    env_file: [.env]
    environment:
      SWARM_HOST: 0.0.0.0
      SWARM_DB: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swarm}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Retrieval semántico persistido en el Postgres con pgvector (Fase 7). Requiere
      # OPENAI_API_KEY en .env; sin clave, el retriever cae a TF-IDF automáticamente.
      SWARM_RETRIEVAL: ${SWARM_RETRIEVAL:-embeddings}
      SWARM_VECTOR_STORE: pgvector
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Ejecutor out-of-process: el ÚNICO servicio con acceso a Docker (vía el proxy).
  # Consume runs de la cola Arq, ejecuta el enjambre en contenedores efímeros y
  # publica los eventos en Redis para que la API los retransmita. Reutiliza la
  # imagen de la API cambiando el comando.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      SWARM_DB: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swarm}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SWARM_RETRIEVAL: ${SWARM_RETRIEVAL:-embeddings}
      SWARM_VECTOR_STORE: pgvector
      SWARM_SANDBOX: docker
      # Habla con el daemon solo a través del proxy con allowlist (nunca el socket
      # crudo). El cliente `docker` lee DOCKER_HOST del entorno.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Runtime endurecido opcional (gVisor) para aislamiento multi-tenant fuerte.
      SWARM_SANDBOX_RUNTIME: ${SWARM_SANDBOX_RUNTIME:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      docker-proxy: { condition: service_healthy }
    # arq no expone HTTP; el healthcheck por curl de la imagen no aplica.
    healthcheck:
      disable: true

volumes:
  pgdata:
